name: Merge Gate

# main への PR ごとに完全 CI を実行する。集約ジョブ "Merge Gate Result" だけを
# Required Status Check に設定することで、サブジョブが skip しても required が
# pending デッドロックせず、将来ジョブを増やしても required 名が安定する。
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        type: string
        description: "検証対象の ref（ブランチ / タグ / SHA）"

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full:
    name: Full CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile
      - run: just lint
      - run: just typecheck
      - run: just test
      - run: just build
      - name: wrangler デプロイ設定の検証（dry-run・認証不要）
        run: pnpm exec wrangler deploy --dry-run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ブラウザと OS 依存を同梱した公式イメージで動かし、apt での取得待ちをなくす。
    # 版は pnpm-lock.yaml の @playwright/test と一致させる（test/ci-playwright.test.ts が検査する）。
    # --user 1001 は runner のユーザーに合わせ、root での Firefox 起動とワークスペースの権限ずれを避ける。
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile
      - run: just e2e

  gate:
    name: Merge Gate Result
    needs: [full, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 集約結果の判定（fail-closed）
        env:
          FULL: ${{ needs.full.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          # full / e2e は条件なしで必ず走るため success 以外（skipped 含む）はすべて落とす。
          echo "full job result: ${FULL}"
          echo "e2e job result: ${E2E}"
          for result in "${FULL}" "${E2E}"; do
            case "${result}" in
              success) ;;
              *) echo "::error::ジョブ結果 '${result}' は許容されない"; exit 1 ;;
            esac
          done
          echo "merge gate passed"
