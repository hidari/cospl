name: CI

# フィーチャーブランチ push 時の速いフィードバック（緩めの高速サブセット）。
# 完全な検証はマージ前に merge-gate.yml が担う。
on:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-26.04
    container:
      image: node:24.22.1-trixie@sha256:016f604a11c4c725f0a4c62e29ff11adab153d297bf97046c9bf2ddb9f1011d3
      options: --user 1001
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - run: pnpm install --frozen-lockfile
      - run: just lint
      - run: just typecheck
      - run: just test
