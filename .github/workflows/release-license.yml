name: Release (license)

# 条文のリリース。cospl-v<版> のタグの push で GitHub Release を作る。
# タグの形式・VERSION との一致・main に含まれることは just release-check が検査する。
# タグの作成は repository ruleset で管理者に限る。
on:
  push:
    tags: ["cospl-v*"]

concurrency:
  group: release-license-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-26.04
    container:
      image: node:24.22.1-trixie@sha256:016f604a11c4c725f0a4c62e29ff11adab153d297bf97046c9bf2ddb9f1011d3
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-check が origin/main との祖先関係を見るため全履歴を取る
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - run: pnpm install --frozen-lockfile
      - run: just release-check "${GITHUB_REF_NAME}" license
      - name: GitHub Release を作成
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#cospl-v}"
          terms="v${version}/CosPL-${version}.md"
          test -f "${terms}" || { echo "::error::${terms} が無い"; exit 1; }
          # gh はイメージに無いので REST API を直接呼ぶ。JSON は node で組んでクォートの崩れを避ける。
          payload=$(node -e 'const [tag, version, url] = process.argv.slice(1); console.log(JSON.stringify({ tag_name: tag, name: `CosPL ${version}`, body: `CosPL ${version} の条文: ${url}` }))' \
            "${GITHUB_REF_NAME}" "${version}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/${terms}")
          # 失敗時（同名の Release が既にある 422 など）に理由をログへ残すため本文ごと出す
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases" \
            -d "${payload}"
          echo "released CosPL ${version}"
